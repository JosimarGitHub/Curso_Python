{% extends 'blogs/base.html' %}
{% load django_bootstrap5 %}

{% block page_header %}

<h2>Add a new post:</h2>

{% endblock page_header %}

{% block content %}

<form action="{% url 'blogs:create_post' %}" method="post">
  {% csrf_token %}
  {% bootstrap_form form %}
  {% bootstrap_button button_type="submit" content="Save" button_class="btn-info" %}
</form>

{% endblock content %}
