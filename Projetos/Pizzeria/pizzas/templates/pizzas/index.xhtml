{% extends 'pizzas/base.xhtml' %}

{% block content %}

<div class="conteudo-lista">
  <p><span>Pizzas</span></p>

  <ul>
    {% for pizza in pizzas %}
      <li><span>
        <a href="{% url 'pizzas:pizza_top' pizza.id %}">
          {{ pizza.name }}</a>
      </span></li>
    {% empty %}
      <li>No topics have been added yet.</li>
    {% endfor %}
  </ul>
</div>

{% endblock content %}
